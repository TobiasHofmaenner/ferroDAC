name: Tests

# Runs the pytest suite on every push / PR so a data-plane or UI-wiring
# regression can't reach the Windows build (or the lab) silently.
# All jobs install the SAME locked environment (uv sync ← pyproject + uv.lock);
# the dep lists used to be hand-copied per job and had already drifted.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dataplane:
    # The fast gate: Qt-free store / resolver / replay / sync / graph + the
    # in-process gRPC e2e. This is the one that must stay green.
    name: data plane + gRPC
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libs
        # the locked env includes PySide6 (uniform everywhere), so test modules
        # that import Qt need its native libs even in the not-ui selection —
        # without them, collection ImportErrors instead of deselecting
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --group dev
      - name: Run data-plane + gRPC suite
        run: uv run pytest -m "not ui" -ra

  dataplane-windows:
    # The data-plane suite on Windows — catches platform-specific bugs that
    # Linux can't (e.g. ':' is legal in ext4 paths but ILLEGAL in NTFS, which
    # once broke the Zarr store on Windows only). The STORE/path layer is the point;
    # the in-process gRPC e2e is excluded here (it's platform-agnostic and covered on
    # Linux — and grpc.aio's asyncio teardown can deadlock on the Windows runner).
    name: data plane (Windows)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --group dev
      - name: Run data-plane suite (store/path layer; gRPC e2e covered on Linux)
        run: uv run pytest -m "not ui and not integration" -ra

  ui:
    # Heavier: PySide6 offscreen smoke tests (window build, replay, the time-axis
    # waterfall, labels). Separate job so the gate above stays fast.
    name: UI smoke (offscreen Qt)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Qt runtime libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install locked environment
        run: uv sync --group dev
      - name: Run UI smoke tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -m ui -ra
