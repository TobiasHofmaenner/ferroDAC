name: Build Release Binaries

# Builds the one-file binaries — a Windows x86-64 .exe (PyInstaller cannot
# cross-compile, hence one job per OS) and a Linux x86-64 binary — and
# publishes both as GitHub Release assets. Both install the SAME locked
# environment (uv sync ← pyproject + uv.lock), so a release ships exactly the
# dependency set the test suite ran against.
# Triggers on tag pushes like v1.0.0 (a -rc suffix marks the release as a
# prerelease); also runnable manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release and upload the assets

env:
  # Run the JS actions on Node 24 instead of the deprecated Node 20 runtime.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-windows:
    # Pinned (not windows-latest) for reproducibility; latest is migrating here.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history + tags → git describe works for manual builds

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The git tag is the single source of truth for the version: stamp it into
      # ferrodac/__init__.py's placeholder before freezing (no manual bump).
      # Manual (workflow_dispatch) builds stamp `git describe` instead.
      - name: Stamp version from the git tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(git describe --tags --always --dirty)"; V="${V#v}"
          fi
          grep -q '__version__ = "0.0.0+dev"' ferrodac/__init__.py
          sed -i "s/__version__ = \"0.0.0+dev\"/__version__ = \"$V\"/" ferrodac/__init__.py
          grep '^__version__' ferrodac/__init__.py

      - name: Install locked environment (+ PyInstaller)
        run: uv sync --group package

      - name: Build EXE
        run: uv run pyinstaller packaging/ferrodac.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferroDAC-windows-x64
          path: dist/ferroDAC.exe

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ferroDAC.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  build-linux:
    # Built on the OLDEST supported LTS: a PyInstaller binary inherits the
    # builder's glibc floor, so 22.04 keeps it runnable on 22.04-and-newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Qt runtime libs (PyInstaller imports the app during analysis)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Stamp version from the git tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(git describe --tags --always --dirty)"; V="${V#v}"
          fi
          grep -q '__version__ = "0.0.0+dev"' ferrodac/__init__.py
          sed -i "s/__version__ = \"0.0.0+dev\"/__version__ = \"$V\"/" ferrodac/__init__.py
          grep '^__version__' ferrodac/__init__.py

      - name: Install locked environment (+ PyInstaller)
        run: uv sync --group package

      - name: Build binary
        run: |
          uv run pyinstaller packaging/ferrodac.spec
          mv dist/ferroDAC dist/ferroDAC-linux-x64

      - name: Smoke-run the frozen binary
        # the whole point: catch a missing bundled lib/driver before it ships —
        # boot offscreen, require it still alive after 25 s (one-file unpack +
        # full startup), then shut it down. This exact smoke caught shelly_cloud
        # missing from the frozen driver list on 2026-07-09.
        run: |
          export QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1
          HOME=/tmp/fd-smoke ./dist/ferroDAC-linux-x64 &
          APP=$!
          sleep 25
          kill -0 "$APP"
          kill "$APP"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ferroDAC-linux-x64
          path: dist/ferroDAC-linux-x64

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ferroDAC-linux-x64
          prerelease: ${{ contains(github.ref_name, '-rc') }}
